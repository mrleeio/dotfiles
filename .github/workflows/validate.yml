name: Validate dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: brew install chezmoi gitleaks
      - name: Scan history for secrets
        run: gitleaks git --redact --verbose .
      - name: Validate all profiles and architectures
        run: python3 tests/validate.py
